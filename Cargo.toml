[package]
name = "iqair-matter"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Matter bridge + local web UI for the IQAir Atem X air purifier (via IQAir's cloud API)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# FanControl cluster handler landed on main after 0.4.1; pin until it is released.
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "8dd6b0d52bd7077b32f3fed8b62202795622472d", features = ["async-io", "groups"] }
async-io = "2"
futures-lite = "2"
embassy-futures = "0.1"
# rs-matter needs a time driver + timer queue from the application.
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-channel = "2"
static_cell = "2"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }

# IQAir's gRPC endpoint only accepts HTTP/2 (HTTP/1.1 gets a 464 from its load balancer).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tiny_http = "0.12"
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
